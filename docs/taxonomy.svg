<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -60 1160 1100">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .comp-text { font-size: 13px; font-weight: 600; fill: #fff; }
    .node-text { font-size: 11.5px; font-weight: 500; fill: #1e293b; }
    .group-label { font-size: 11px; font-style: italic; fill: #94a3b8; }
    .legend-text { font-size: 11px; fill: #64748b; }
    .ring-label { font-size: 10px; fill: #94a3b8; letter-spacing: 0.5px; }
    .hybrid-text { font-size: 11px; font-weight: 600; fill: #1e293b; }
    .hybrid-label { font-size: 10px; font-style: italic; fill: #94a3b8; }
  </style>

  <!-- Ring guides -->
  <circle cx="500" cy="500" r="110" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="500" cy="500" r="260" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="500" cy="500" r="400" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Hybrid ring guide (between cognition and perceiver rings) -->
  <circle cx="500" cy="500" r="330" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Connection curves -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">

    <!-- Dyslexic connections (orange) -->
    <g stroke="#ff6b35" opacity="0.4">
      <!-- To Fragmentary cognitions -->
      <path d="M500,390 Q418,326 347,290"/>
      <path d="M500,390 Q471,303 446,246"/>
      <path d="M500,390 Q529,303 554,246"/>
      <path d="M500,390 Q583,326 653,290"/>
      <!-- To perceivers: Empath, Provocateur, Observer, Mortal, Child, Includer, Achala -->
      <path d="M500,390 Q500,230 500,100"/>
      <path d="M500,390 Q640,285 757,194"/>
      <path d="M500,390 Q720,405 894,431"/>
      <path d="M500,390 Q575,650 637,876"/>
      <path d="M500,390 Q425,650 363,876"/>
      <path d="M500,390 Q310,550 154,700"/>
      <path d="M500,390 Q365,285 243,194"/>
      <!-- Skeptic: excluded by default, available via include flag -->
      <path d="M500,390 Q290,405 106,431" stroke-dasharray="6 4"/>
      <!-- To Logician hybrid -->
      <path d="M500,390 Q662,378 805,374"/>
    </g>

    <!-- Spiral connections (purple) -->
    <g stroke="#7b2d8e" opacity="0.4">
      <!-- To Deepening cognitions -->
      <path d="M405,555 Q379,652 370,725"/>
      <path d="M405,555 Q327,601 275,630"/>
      <path d="M405,555 Q308,530 240,500"/>
      <!-- To perceivers: Empath, Provocateur, Observer, Skeptic, Includer, Achala -->
      <path d="M405,555 Q449,313 500,100"/>
      <path d="M405,555 Q590,365 757,194"/>
      <path d="M405,555 Q665,490 894,431"/>
      <path d="M405,555 Q245,490 106,431"/>
      <path d="M405,555 Q270,630 154,700"/>
      <path d="M405,555 Q318,365 243,194"/>
    </g>

    <!-- Lapidary connections (amber/bronze) -->
    <g stroke="#b07d2e" opacity="0.4">
      <!-- To Evaluative cognitions -->
      <path d="M595,555 Q693,530 760,500"/>
      <path d="M595,555 Q673,601 725,630"/>
      <path d="M595,555 Q622,652 630,725"/>
      <!-- To perceivers: Empath, Connoisseur, Provocateur, Observer, Skeptic, Achala -->
      <path d="M595,555 Q552,314 500,100"/>
      <path d="M595,555 Q730,630 846,700"/>
      <path d="M595,555 Q690,365 757,194"/>
      <path d="M595,555 Q760,490 894,431"/>
      <path d="M595,555 Q340,490 106,431"/>
      <path d="M595,555 Q410,365 243,194"/>
      <!-- To Logician hybrid -->
      <path d="M595,555 Q712,460 805,374"/>
    </g>

    <!-- Spiral to Logician: dashed, opt-in via include flag -->
    <g stroke="#7b2d8e" opacity="0.3">
      <path d="M405,555 Q618,458 805,374" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hybrid node - The Logician (between cognition and perceiver rings) -->
  <g>
    <rect x="765" y="361" width="80" height="26" rx="13" fill="#f0fdf4" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="765" y="361" width="80" height="26" rx="13" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="hybrid-text" x="805" y="374" text-anchor="middle" dominant-baseline="central">Logician</text>
  </g>
  <text class="hybrid-label" x="805" y="399" text-anchor="middle">Hybrid</text>

  <!-- Cognition group labels -->
  <text class="group-label" x="500" y="340" text-anchor="middle">Fragmentary</text>
  <text class="group-label" x="340" y="600" text-anchor="middle">Deepening</text>
  <text class="group-label" x="660" y="600" text-anchor="middle">Evaluative</text>

  <!-- Perceiver nodes (outer ring, r=400, 9 perceivers, 40deg spacing from 270deg clockwise) -->
  <g>
    <!-- 270deg: top centre -->
    <rect x="466" y="87" width="68" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="500" y="100" text-anchor="middle" dominant-baseline="central">Empath</text>

    <!-- 310deg: upper-right -->
    <rect x="706" y="181" width="102" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="757" y="194" text-anchor="middle" dominant-baseline="central">Provocateur</text>

    <!-- 350deg: right -->
    <rect x="855" y="418" width="78" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="894" y="431" text-anchor="middle" dominant-baseline="central">Observer</text>

    <!-- 30deg: lower-right -->
    <rect x="795" y="687" width="102" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="846" y="700" text-anchor="middle" dominant-baseline="central">Connoisseur</text>

    <!-- 70deg: bottom-right -->
    <rect x="601" y="863" width="72" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="637" y="876" text-anchor="middle" dominant-baseline="central">Mortal</text>

    <!-- 110deg: bottom-left -->
    <rect x="335" y="863" width="56" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="363" y="876" text-anchor="middle" dominant-baseline="central">Child</text>

    <!-- 150deg: lower-left -->
    <rect x="116" y="687" width="76" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="154" y="700" text-anchor="middle" dominant-baseline="central">Includer</text>

    <!-- 190deg: left -->
    <rect x="72" y="418" width="68" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="106" y="431" text-anchor="middle" dominant-baseline="central">Skeptic</text>

    <!-- 230deg: upper-left -->
    <rect x="212" y="181" width="62" height="26" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-text" x="243" y="194" text-anchor="middle" dominant-baseline="central">Achala</text>
  </g>

  <!-- Cognition nodes - Fragmentary (r=260, centered at 270deg, 24deg spacing) -->
  <g>
    <rect x="299" y="277" width="96" height="26" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text class="node-text" x="347" y="290" text-anchor="middle" dominant-baseline="central">Decomposer</text>

    <rect x="400" y="233" width="92" height="26" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text class="node-text" x="446" y="246" text-anchor="middle" dominant-baseline="central">Associator</text>

    <rect x="523" y="233" width="62" height="26" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text class="node-text" x="554" y="246" text-anchor="middle" dominant-baseline="central">Scaler</text>

    <rect x="620" y="277" width="66" height="26" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text class="node-text" x="653" y="290" text-anchor="middle" dominant-baseline="central">Reifier</text>
  </g>

  <!-- Cognition nodes - Deepening (r=260, centered at 150deg, 30deg spacing) -->
  <g>
    <rect x="332" y="712" width="76" height="26" rx="13" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text class="node-text" x="370" y="725" text-anchor="middle" dominant-baseline="central">Diverger</text>

    <rect x="228" y="617" width="94" height="26" rx="13" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text class="node-text" x="275" y="630" text-anchor="middle" dominant-baseline="central">Analogiser</text>

    <rect x="197" y="487" width="86" height="26" rx="13" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text class="node-text" x="240" y="500" text-anchor="middle" dominant-baseline="central">Integrator</text>
  </g>

  <!-- Cognition nodes - Evaluative (r=260, centered at 30deg, 30deg spacing) -->
  <g>
    <rect x="729" y="487" width="62" height="26" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text class="node-text" x="760" y="500" text-anchor="middle" dominant-baseline="central">Editor</text>

    <rect x="682" y="617" width="86" height="26" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text class="node-text" x="725" y="630" text-anchor="middle" dominant-baseline="central">Appraiser</text>

    <rect x="590" y="712" width="80" height="26" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text class="node-text" x="630" y="725" text-anchor="middle" dominant-baseline="central">Historian</text>
  </g>

  <!-- Composition nodes (inner ring, r=110, 120deg spacing from 270deg) -->
  <g>
    <rect x="459" y="374" width="82" height="32" rx="16" fill="#ff6b35"/>
    <text class="comp-text" x="500" y="390" text-anchor="middle" dominant-baseline="central">Dyslexic</text>

    <rect x="372" y="539" width="66" height="32" rx="16" fill="#7b2d8e"/>
    <text class="comp-text" x="405" y="555" text-anchor="middle" dominant-baseline="central">Spiral</text>

    <rect x="554" y="539" width="82" height="32" rx="16" fill="#b07d2e"/>
    <text class="comp-text" x="595" y="555" text-anchor="middle" dominant-baseline="central">Lapidary</text>
  </g>

  <!-- Legend -->
  <g>
    <line x1="175" y1="975" x2="205" y2="975" stroke="#ff6b35" stroke-width="2.5"/>
    <text class="legend-text" x="213" y="979">Dyslexic</text>

    <line x1="300" y1="975" x2="330" y2="975" stroke="#7b2d8e" stroke-width="2.5"/>
    <text class="legend-text" x="338" y="979">Spiral</text>

    <line x1="400" y1="975" x2="430" y2="975" stroke="#b07d2e" stroke-width="2.5"/>
    <text class="legend-text" x="438" y="979">Lapidary</text>

    <line x1="525" y1="975" x2="555" y2="975" stroke="#64748b" stroke-width="2" stroke-dasharray="5 3"/>
    <text class="legend-text" x="563" y="979">Opt-in (--include)</text>

    <text class="legend-text" x="700" y="979">All perceivers optional per composition</text>

    <text class="ring-label" x="500" y="1005" text-anchor="middle">INNER: COMPOSITIONS · MIDDLE: COGNITIONS · HYBRID RING · OUTER: PERCEIVERS</text>
  </g>
</svg>
