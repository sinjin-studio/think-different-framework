<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 436">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .agent { font-size: 10px; font-weight: 500; fill: #334155; }
    .title { font-size: 10px; font-weight: 700; fill: #b07d2e; }
    .sub { font-size: 8.5px; fill: #94a3b8; font-style: italic; }
    .mech { font-size: 9.5px; font-weight: 600; fill: #fff; }
    .ground-title { font-size: 10px; font-weight: 700; fill: #2d6a4f; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ═══ ROW 1 ═══ -->

  <!-- Appraise Seed -->
  <rect x="14" y="66" width="56" height="56" rx="28" fill="#fffbeb" stroke="#b07d2e" stroke-width="1.5"/>
  <text x="42" y="88" text-anchor="middle" font-size="9" font-weight="600" fill="#b07d2e">Appraise</text>
  <text x="42" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#b07d2e">Seed</text>

  <line x1="74" y1="94" x2="97" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Pass 1 -->
  <rect x="102" y="18" width="130" height="152" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text class="title" x="112" y="36">Pass 1</text>
  <text class="sub" x="112" y="48">Rough Cut</text>
  <text class="agent" x="112" y="68">⚖️ Appraiser</text>
  <text class="agent" x="112" y="84">📜 Historian</text>
  <text class="agent" x="112" y="100">❤️‍🔥 Empath</text>
  <text class="agent" x="112" y="116">👁️ Observer</text>
  <text class="agent" x="112" y="132">✂️ Editor</text>
  <text class="agent" x="112" y="148">🏺 Connoisseur</text>

  <line x1="236" y1="94" x2="259" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Polish 1 -->
  <rect x="264" y="82" width="56" height="24" rx="12" fill="#7b2d8e"/>
  <text class="mech" x="292" y="94" text-anchor="middle" dominant-baseline="central">Polish</text>

  <line x1="324" y1="94" x2="347" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Pass 2 -->
  <rect x="352" y="30" width="130" height="144" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text class="title" x="362" y="48">Pass 2</text>
  <text class="sub" x="362" y="60">Shape</text>
  <text class="agent" x="362" y="80">📜 Historian</text>
  <text class="agent" x="362" y="96">⚖️ Appraiser</text>
  <text class="agent" x="362" y="112">🔥 Provocateur</text>
  <text class="agent" x="362" y="128">🧩 Logician</text>
  <text class="agent" x="362" y="144">✂️ Editor</text>
  <text class="agent" x="362" y="160">🏺 Connoisseur</text>

  <line x1="486" y1="94" x2="509" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Friction -->
  <rect x="514" y="82" width="62" height="24" rx="12" fill="#ff6b35"/>
  <text class="mech" x="545" y="94" text-anchor="middle" dominant-baseline="central">Friction</text>

  <line x1="580" y1="94" x2="603" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Polish 2 -->
  <rect x="608" y="82" width="56" height="24" rx="12" fill="#7b2d8e"/>
  <text class="mech" x="636" y="94" text-anchor="middle" dominant-baseline="central">Polish</text>

  <!-- Wrap arrow row 1 to row 2 -->
  <path d="M668,94 Q694,94 694,186 Q694,280 668,280" fill="none" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ═══ ROW 2 ═══ -->

  <!-- Pass 3 -->
  <rect x="530" y="216" width="130" height="128" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text class="title" x="540" y="234">Pass 3</text>
  <text class="sub" x="540" y="246">Facet</text>
  <text class="agent" x="540" y="266">⚖️ Appraiser</text>
  <text class="agent" x="540" y="282">📜 Historian</text>
  <text class="agent" x="540" y="298">🧿 Skeptic</text>
  <text class="agent" x="540" y="314">✂️ Editor</text>
  <text class="agent" x="540" y="330">🏺 Connoisseur</text>

  <line x1="526" y1="280" x2="503" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Bias Check -->
  <rect x="437" y="268" width="62" height="24" rx="12" fill="#9b59b6"/>
  <text class="mech" x="468" y="280" text-anchor="middle" dominant-baseline="central">Bias</text>

  <line x1="433" y1="280" x2="410" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Ground -->
  <rect x="310" y="248" width="92" height="64" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text class="ground-title" x="320" y="266">Ground</text>
  <text class="agent" x="320" y="286">❤️‍🔥 Empath</text>
  <text class="agent" x="320" y="302">✂️ Editor</text>

  <line x1="306" y1="280" x2="283" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Presentation -->
  <rect x="180" y="265" width="100" height="30" rx="15" fill="#2d6a4f"/>
  <text class="mech" x="230" y="280" text-anchor="middle" dominant-baseline="central">Presentation</text>

  <!-- Legend -->
  <g transform="translate(780, 360)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#7b2d8e"/>
    <text font-size="9" fill="#64748b" x="18" y="10">Polish</text>
    <rect x="70" y="0" width="12" height="12" rx="3" fill="#ff6b35"/>
    <text font-size="9" fill="#64748b" x="88" y="10">Friction</text>
    <rect x="145" y="0" width="12" height="12" rx="3" fill="#9b59b6"/>
    <text font-size="9" fill="#64748b" x="163" y="10">Bias</text>
  </g>
</svg>
