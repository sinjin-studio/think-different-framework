<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 180">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .node { font-size: 11px; font-weight: 500; fill: #1e293b; }
    .accent { font-size: 11px; font-weight: 600; fill: #fff; }
    .note { font-size: 9px; fill: #94a3b8; }
    .label { font-size: 9.5px; fill: #94a3b8; font-style: italic; letter-spacing: 0.3px; }
    .ground-node { font-size: 11px; font-weight: 500; fill: #2d6a4f; }
    .mech { font-size: 7.5px; font-weight: 600; fill: #fff; }
    .loop-note { font-size: 8px; fill: #b8860b; font-style: italic; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#d4a017" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="18" y="52" width="120" height="36" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="78" y="65" text-anchor="middle" dominant-baseline="central">Seed / Brief /</text>
  <text class="node" x="78" y="77" text-anchor="middle" dominant-baseline="central">Brand / Notes</text>
  <text class="label" x="78" y="42">INPUT</text>

  <line x1="142" y1="70" x2="168" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Distil (orange) -->
  <rect x="173" y="56" width="70" height="28" rx="14" fill="#ff6b35"/>
  <text class="accent" x="208" y="70" text-anchor="middle" dominant-baseline="central">Distil</text>

  <line x1="247" y1="70" x2="273" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Provocation(s) (orange) -->
  <rect x="278" y="56" width="110" height="28" rx="14" fill="#ff6b35"/>
  <text class="accent" x="333" y="70" text-anchor="middle" dominant-baseline="central">Provocation(s)</text>

  <line x1="392" y1="70" x2="418" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- pick? -->
  <text class="note" x="405" y="100">pick?</text>

  <!-- Session core (purple dashed border) -->
  <rect x="422" y="38" width="510" height="52" rx="26" fill="none" stroke="#7b2d8e" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <text class="label" x="432" y="30">SESSION (per provocation)</text>

  <!-- Gather context -->
  <rect x="432" y="56" width="90" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="477" y="70" text-anchor="middle" dominant-baseline="central">Gather context</text>

  <line x1="526" y1="70" x2="544" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Seed Prep -->
  <rect x="548" y="56" width="80" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="588" y="70" text-anchor="middle" dominant-baseline="central">Seed Prep</text>
  <text class="note" x="588" y="48" text-anchor="middle">Fracture / Tune / Appraise</text>

  <line x1="632" y1="70" x2="650" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Compose (purple) -->
  <rect x="654" y="56" width="80" height="28" rx="14" fill="#7b2d8e"/>
  <text class="accent" x="694" y="70" text-anchor="middle" dominant-baseline="central">Compose</text>

  <!-- Mechanism strip below Compose -->
  <line x1="694" y1="84" x2="694" y2="94" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="614" y="96" width="38" height="16" rx="8" fill="#ff6b35"/>
  <text class="mech" x="633" y="104" text-anchor="middle" dominant-baseline="central">Friction</text>
  <rect x="655" y="96" width="40" height="16" rx="8" fill="#4a90d9"/>
  <text class="mech" x="675" y="104" text-anchor="middle" dominant-baseline="central">Sensory</text>
  <rect x="698" y="96" width="26" height="16" rx="8" fill="#9b59b6"/>
  <text class="mech" x="711" y="104" text-anchor="middle" dominant-baseline="central">Bias</text>
  <rect x="727" y="96" width="50" height="16" rx="8" fill="#d4a017"/>
  <text class="mech" x="752" y="104" text-anchor="middle" dominant-baseline="central">Transcend</text>
  <rect x="780" y="96" width="58" height="16" rx="8" fill="#0d9488"/>
  <text class="mech" x="809" y="104" text-anchor="middle" dominant-baseline="central">Neg Space</text>

  <!-- Compaction (opt-in) + Memory markers (below mechanism strip) -->
  <rect x="614" y="116" width="58" height="14" rx="7" fill="#3b82f6" opacity="0.35"/>
  <text class="mech" x="643" y="123" text-anchor="middle" dominant-baseline="central">Compact*</text>
  <rect x="676" y="116" width="54" height="14" rx="7" fill="#6b7280" opacity="0.8"/>
  <text class="mech" x="703" y="123" text-anchor="middle" dominant-baseline="central">Mech Mem</text>

  <!-- Memory arrow showing mechanism state threading -->
  <path d="M633,112 L633,116" stroke="#6b7280" stroke-width="0.8"/>
  <path d="M703,112 L703,116" stroke="#6b7280" stroke-width="0.8"/>

  <line x1="738" y1="70" x2="756" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ground -->
  <rect x="760" y="56" width="68" height="28" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text class="ground-node" x="794" y="70" text-anchor="middle" dominant-baseline="central">Ground</text>

  <line x1="832" y1="70" x2="850" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Review (gold) -->
  <rect x="854" y="56" width="66" height="28" rx="14" fill="#d4a017"/>
  <text class="accent" x="887" y="70" text-anchor="middle" dominant-baseline="central">Review</text>
  <text class="note" x="887" y="48" text-anchor="middle">autonomous</text>

  <!-- Review restart loop arrow -->
  <path d="M887,86 C887,155 588,155 588,86" fill="none" stroke="#d4a017" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-gold)"/>
  <text class="loop-note" x="737" y="163" text-anchor="middle">restart w/ mutations</text>

  <line x1="934" y1="70" x2="960" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Generate / Synthesise -->
  <rect x="965" y="56" width="110" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="1020" y="70" text-anchor="middle" dominant-baseline="central">Gen / Synthesise</text>
  <text class="note" x="1020" y="100" text-anchor="middle">1 seed: generate</text>
  <text class="note" x="1020" y="112" text-anchor="middle">N seeds: synthesise</text>
  <rect x="984" y="116" width="72" height="14" rx="7" fill="#0d9488" opacity="0.8"/>
  <text class="mech" x="1020" y="123" text-anchor="middle" dominant-baseline="central">Neg Space</text>

  <line x1="1079" y1="70" x2="1105" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Distil findings (orange) -->
  <rect x="1110" y="56" width="70" height="28" rx="14" fill="#ff6b35"/>
  <text class="accent" x="1145" y="70" text-anchor="middle" dominant-baseline="central">Distil</text>
  <text class="note" x="1145" y="100" text-anchor="middle">findings → lines → asset</text>
  <text class="note" x="1145" y="112" text-anchor="middle">→ sections</text>

  <line x1="1184" y1="70" x2="1210" y2="70" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Presentation (green) -->
  <rect x="1215" y="50" width="110" height="40" rx="20" fill="#2d6a4f"/>
  <text class="accent" x="1270" y="70" text-anchor="middle" dominant-baseline="central">Presentation</text>
</svg>
