<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 120">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .node { font-size: 11px; font-weight: 500; fill: #1e293b; }
    .accent { font-size: 11px; font-weight: 600; fill: #fff; }
    .note { font-size: 9px; fill: #94a3b8; }
    .label { font-size: 9.5px; fill: #94a3b8; font-style: italic; letter-spacing: 0.3px; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="18" y="40" width="120" height="36" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="78" y="53" text-anchor="middle" dominant-baseline="central">Seed / Brief /</text>
  <text class="node" x="78" y="65" text-anchor="middle" dominant-baseline="central">Brand / Notes</text>
  <text class="label" x="78" y="30">INPUT</text>

  <line x1="142" y1="58" x2="168" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Distil (orange) -->
  <rect x="173" y="44" width="70" height="28" rx="14" fill="#ff6b35"/>
  <text class="accent" x="208" y="58" text-anchor="middle" dominant-baseline="central">Distil</text>

  <line x1="247" y1="58" x2="273" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Seeds (orange) -->
  <rect x="278" y="44" width="70" height="28" rx="14" fill="#ff6b35"/>
  <text class="accent" x="313" y="58" text-anchor="middle" dominant-baseline="central">Seeds</text>

  <line x1="352" y1="58" x2="378" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- pick? -->
  <text class="note" x="365" y="88">pick?</text>

  <!-- Session core (purple dashed border) -->
  <rect x="382" y="32" width="370" height="52" rx="26" fill="none" stroke="#7b2d8e" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <text class="label" x="392" y="26">SESSION (per seed)</text>

  <!-- Gather context -->
  <rect x="392" y="44" width="100" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="442" y="58" text-anchor="middle" dominant-baseline="central">Gather context</text>

  <line x1="496" y1="58" x2="512" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Fracture / Tune -->
  <rect x="517" y="44" width="100" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="567" y="58" text-anchor="middle" dominant-baseline="central">Fracture / Tune</text>

  <line x1="621" y1="58" x2="637" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Run composition (purple) -->
  <rect x="642" y="44" width="100" height="28" rx="14" fill="#7b2d8e"/>
  <text class="accent" x="692" y="58" text-anchor="middle" dominant-baseline="central">Compose</text>

  <line x1="756" y1="58" x2="782" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Generate / Synthesise -->
  <rect x="787" y="44" width="110" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="node" x="842" y="58" text-anchor="middle" dominant-baseline="central">Gen / Synthesise</text>
  <text class="note" x="842" y="88">1 seed: generate</text>
  <text class="note" x="842" y="100">N seeds: synthesise</text>

  <line x1="901" y1="58" x2="927" y2="58" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Presentation (green) -->
  <rect x="932" y="38" width="110" height="40" rx="20" fill="#2d6a4f"/>
  <text class="accent" x="987" y="58" text-anchor="middle" dominant-baseline="central">Presentation</text>
</svg>
