<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .lens { font-size: 10px; font-weight: 500; fill: #334155; }
    .title { font-size: 10px; font-weight: 700; fill: #ff6b35; }
    .sub { font-size: 8.5px; fill: #94a3b8; font-style: italic; }
    .mech { font-size: 9.5px; font-weight: 600; fill: #fff; }
    .ground-title { font-size: 10px; font-weight: 700; fill: #2d6a4f; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ═══ ROW 1 ═══ -->

  <!-- Fracture Seed -->
  <rect x="14" y="66" width="56" height="56" rx="28" fill="#fff7ed" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="42" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#ff6b35">Fracture</text>
  <text x="42" y="102" text-anchor="middle" font-size="9" font-weight="600" fill="#ff6b35">Seed</text>

  <line x1="74" y1="94" x2="97" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Round 1 -->
  <rect x="102" y="18" width="130" height="152" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text class="title" x="112" y="36">Round 1</text>
  <text class="sub" x="112" y="48">First Fragments</text>
  <text class="lens" x="112" y="68">🔍 Decomposer</text>
  <text class="lens" x="112" y="84">❤️‍🔥 Empath</text>
  <text class="lens" x="112" y="100">🪢 Associator</text>
  <text class="lens" x="112" y="116">👁️ Observer</text>
  <text class="lens" x="112" y="132">🪑 Includer</text>
  <text class="lens" x="112" y="148">🔍 Decomposer</text>

  <line x1="236" y1="94" x2="259" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Friction 1 -->
  <rect x="264" y="82" width="62" height="24" rx="12" fill="#ff6b35"/>
  <text class="mech" x="295" y="94" text-anchor="middle" dominant-baseline="central">Friction</text>

  <line x1="330" y1="94" x2="353" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Round 2 -->
  <rect x="358" y="30" width="130" height="160" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text class="title" x="368" y="48">Round 2</text>
  <text class="sub" x="368" y="60">Scale Shift</text>
  <text class="lens" x="368" y="80">🔭 Scaler</text>
  <text class="lens" x="368" y="96">🧒 Child</text>
  <text class="lens" x="368" y="112">🪢 Associator</text>
  <text class="lens" x="368" y="128">🔥 Provocateur</text>
  <text class="lens" x="368" y="144">🕯️ Achala</text>
  <text class="lens" x="368" y="160">🧩 Logician</text>
  <text class="lens" x="368" y="176">🔭 Scaler</text>

  <line x1="492" y1="94" x2="515" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Friction 2 -->
  <rect x="520" y="82" width="62" height="24" rx="12" fill="#ff6b35"/>
  <text class="mech" x="551" y="94" text-anchor="middle" dominant-baseline="central">Friction</text>

  <line x1="586" y1="94" x2="609" y2="94" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Sensory Check -->
  <rect x="614" y="82" width="66" height="24" rx="12" fill="#4a90d9"/>
  <text class="mech" x="647" y="94" text-anchor="middle" dominant-baseline="central">Sensory</text>

  <!-- Wrap arrow row 1 to row 2 -->
  <path d="M684,94 Q710,94 710,186 Q710,280 684,280" fill="none" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ═══ ROW 2 ═══ -->

  <!-- Round 3 -->
  <rect x="546" y="216" width="130" height="144" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text class="title" x="556" y="234">Round 3</text>
  <text class="sub" x="556" y="246">Deep Fragments</text>
  <text class="lens" x="556" y="266">🔍 Decomposer</text>
  <text class="lens" x="556" y="282">⏳ Mortal</text>
  <text class="lens" x="556" y="298">🪢 Associator</text>
  <text class="lens" x="556" y="314">👁️ Observer</text>
  <text class="lens" x="556" y="330">❤️‍🔥 Empath</text>
  <text class="lens" x="556" y="346">🧩 Logician</text>

  <line x1="542" y1="280" x2="519" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Friction 3 -->
  <rect x="453" y="268" width="62" height="24" rx="12" fill="#ff6b35"/>
  <text class="mech" x="484" y="280" text-anchor="middle" dominant-baseline="central">Friction</text>

  <line x1="449" y1="280" x2="435" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Negative Space Check -->
  <rect x="361" y="268" width="70" height="24" rx="12" fill="#0d9488"/>
  <text class="mech" x="396" y="280" text-anchor="middle" dominant-baseline="central">Neg Space</text>

  <line x1="357" y1="280" x2="343" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Bias Check -->
  <rect x="297" y="268" width="62" height="24" rx="12" fill="#9b59b6"/>
  <text class="mech" x="328" y="280" text-anchor="middle" dominant-baseline="central">Bias</text>

  <line x1="293" y1="280" x2="279" y2="280" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Rounds 4-5 (Extended) -->
  <rect x="26" y="224" width="248" height="68" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="title" x="36" y="242">Rounds 4-5</text>
  <text class="sub" x="36" y="254">Extended Fragments</text>
  <text class="lens" x="36" y="274">🔍 Decomposer → 🪢 Associator → 🔭 Scaler → ❤️‍🔥 Empath</text>
  <text class="sub" x="36" y="286">+ Friction per round</text>

  <!-- Arrow from Rounds 4-5 down to Row 3 -->
  <path d="M150,296 Q150,316 150,330" fill="none" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ═══ ROW 3 ═══ -->

  <!-- Negative Space after Round 5 -->
  <rect x="16" y="336" width="70" height="24" rx="12" fill="#0d9488"/>
  <text class="mech" x="51" y="348" text-anchor="middle" dominant-baseline="central">Neg Space</text>

  <line x1="90" y1="348" x2="96" y2="348" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Transcendence after Round 5 (two-strike) -->
  <rect x="100" y="336" width="92" height="24" rx="12" fill="#d4a017"/>
  <text class="mech" x="146" y="348" text-anchor="middle" dominant-baseline="central">Transcend</text>
  <text font-size="7" fill="#94a3b8" x="146" y="372" text-anchor="middle">two-strike</text>

  <line x1="196" y1="348" x2="212" y2="348" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Rounds 6-7 (if not grounded) -->
  <rect x="216" y="324" width="248" height="68" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="title" x="226" y="342">Rounds 6-7</text>
  <text class="sub" x="226" y="354">Extended Fragments (if continuing)</text>
  <text class="lens" x="226" y="374">🔍 Decomposer → 🪢 Associator → 🔭 Scaler → ❤️‍🔥 Empath</text>
  <text class="sub" x="226" y="386">+ Friction, Neg Space, Transcendence per round</text>

  <line x1="468" y1="358" x2="484" y2="358" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Final Round: Constellation -->
  <rect x="488" y="324" width="130" height="124" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text class="title" x="498" y="342">Final Round</text>
  <text class="sub" x="498" y="354">Constellation</text>
  <text class="lens" x="498" y="374">💎 Reifier</text>
  <text class="lens" x="498" y="390">🪢 Associator</text>
  <text class="lens" x="498" y="406">🕯️ Achala</text>
  <text class="lens" x="498" y="422">⏳ Mortal</text>
  <text class="lens" x="498" y="438">🔥 Provocateur</text>

  <!-- Arrow from Constellation down to Ground -->
  <path d="M553,452 Q553,468 553,478" fill="none" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Ground -->
  <rect x="508" y="482" width="92" height="64" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text class="ground-title" x="518" y="500">Ground</text>
  <text class="lens" x="518" y="520">❤️‍🔥 Empath</text>
  <text class="lens" x="518" y="536">💎 Reifier</text>

  <!-- Arrow from Ground to Presentation -->
  <path d="M554,550 Q554,564 554,572" fill="none" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Presentation -->
  <rect x="504" y="576" width="100" height="30" rx="15" fill="#2d6a4f"/>
  <text class="mech" x="554" y="591" text-anchor="middle" dominant-baseline="central">Presentation</text>

  <!-- Mechanism memory arrows: state flows between mechanism checks -->
  <!-- Friction 1 -> Friction 2 (via memory) -->
  <path d="M295,108 C295,140 551,140 551,108" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <text font-size="7" fill="#6b7280" x="423" y="148" text-anchor="middle" opacity="0.7">memory</text>

  <!-- Friction 2 -> Friction 3 (via memory, across rows) -->
  <path d="M551,108 C570,160 510,210 484,266" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Friction 3 -> Neg Space -> Bias (memory chain) -->
  <path d="M453,280 L435,280" fill="none" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
  <path d="M377,280 L363,280" fill="none" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>

  <!-- Legend -->
  <g transform="translate(250, 680)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#ff6b35"/>
    <text font-size="9" fill="#64748b" x="18" y="10">Friction</text>
    <rect x="75" y="0" width="12" height="12" rx="3" fill="#4a90d9"/>
    <text font-size="9" fill="#64748b" x="93" y="10">Sensory</text>
    <rect x="150" y="0" width="12" height="12" rx="3" fill="#0d9488"/>
    <text font-size="9" fill="#64748b" x="168" y="10">Negative Space</text>
    <rect x="250" y="0" width="12" height="12" rx="3" fill="#9b59b6"/>
    <text font-size="9" fill="#64748b" x="268" y="10">Bias</text>
    <rect x="310" y="0" width="12" height="12" rx="3" fill="#d4a017"/>
    <text font-size="9" fill="#64748b" x="328" y="10">Transcendence</text>
    <line x1="410" y1="6" x2="440" y2="6" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2"/>
    <text font-size="9" fill="#64748b" x="446" y="10">Mechanism Memory</text>
    <rect x="550" y="0" width="60" height="12" rx="3" fill="none" stroke="#fdba74" stroke-width="1" stroke-dasharray="4 3"/>
    <text font-size="9" fill="#64748b" x="618" y="10">Extended (variable)</text>
  </g>
</svg>
