<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Think Different Framework - Test Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #181818;
  --bg-surface: #222;
  --bg-elevated: #2a2a2a;
  --bg-input: #1e1e1e;
  --border: #333;
  --border-focus: #169B62;
  --text: #e0e0e0;
  --text-muted: #777;
  --text-dim: #555;
  --green: #169B62;
  --green-dim: #0d6b42;
  --green-glow: rgba(22, 155, 98, 0.15);
  --orange: #FF8200;
  --orange-dim: #cc6800;
  --red: #e74c3c;
  --font: 'Literata', Georgia, serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
  --radius: 6px;
  --radius-lg: 10px;
}
html { font-size: 17px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.5;
  min-height: 100vh;
}
header {
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
}
header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
header h1 span { color: var(--green); }
header .version {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-family: var(--mono);
}
header .npm-link {
  margin-left: auto;
  display: flex;
  align-items: center;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
}
header .npm-link:hover { color: var(--red); }
header .npm-link svg { width: 32px; height: 13px; fill: currentColor; }
.layout {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  max-width: 1400px;
  margin: 0 auto;
}
.form-col {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  overflow-y: auto;
}
.preview-col {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 1.5rem 1.5rem 1.5rem 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1rem;
}
section {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.2rem;
}
section h2 {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--green);
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.field { margin-bottom: 1rem; }
.field:last-child { margin-bottom: 0; }
.field-row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.8rem;
}
.field-row:last-child { margin-bottom: 0; }
label {
  font-size: 1.0rem;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  margin-bottom: 0.3rem;
}
label .flag {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 0.4rem;
}
.help {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}
input[type="text"],
input[type="number"],
textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.85rem;
  padding: 0.5rem 0.7rem;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 2px var(--green-glow);
}
textarea { resize: vertical; min-height: 60px; }
input[type="number"] { width: 80px; }
input[type="range"] {
  flex: 1;
  max-width: 200px;
  accent-color: var(--green);
  height: 4px;
}

/* Radio cards for input mode */
.radio-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 0.5rem;
}
.radio-card {
  position: relative;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.6rem 0.7rem;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.8rem;
}
.radio-card:hover { border-color: var(--text-muted); }
.radio-card.active {
  border-color: var(--green);
  background: var(--green-glow);
}
.radio-card input { display: none; }
.radio-card .card-label { font-weight: 600; }
.radio-card .card-flag {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-muted);
  display: block;
  margin-top: 0.15rem;
}

/* Segmented control */
.segmented {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.segmented button {
  background: var(--bg-elevated);
  border: none;
  color: var(--text-muted);
  font-family: var(--font);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.45rem 1rem;
  cursor: pointer;
  transition: all 0.15s;
  border-right: 1px solid var(--border);
}
.segmented button:last-child { border-right: none; }
.segmented button:hover { color: var(--text); }
.segmented button.active {
  background: var(--green);
  color: #fff;
}

/* Toggle switch */
.toggle-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.toggle {
  position: relative;
  width: 38px;
  height: 20px;
  flex-shrink: 0;
}
.toggle input { display: none; }
.toggle .slider {
  position: absolute;
  inset: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.toggle .slider::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: var(--text-muted);
  border-radius: 50%;
  transition: all 0.2s;
}
.toggle input:checked + .slider {
  background: var(--green-dim);
  border-color: var(--green);
}
.toggle input:checked + .slider::after {
  transform: translateX(18px);
  background: var(--green);
}
.toggle-label {
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
.toggle-help {
  font-size: 0.7rem;
  color: var(--text-muted);
}

/* Chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.chip {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.3rem 0.7rem;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.chip:hover { border-color: var(--text-muted); }
.chip.active {
  background: var(--green-glow);
  border-color: var(--green);
  color: var(--green);
}
.chip.active-orange {
  background: rgba(255, 130, 0, 0.12);
  border-color: var(--orange);
  color: var(--orange);
}
.chip .chip-x {
  display: inline-block;
  margin-left: 0.3rem;
  opacity: 0.5;
  font-size: 0.7rem;
  vertical-align: middle;
}
.chip .chip-x:hover { opacity: 1; }
.practitioner-add-row {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.5rem;
}
.practitioner-add-row input {
  flex: 1;
  font-size: 1.0rem;
  padding: 0.3rem 0.6rem;
}
.practitioner-add-row .btn {
  font-size: 0.8rem;
  padding: 0.3rem 0.6rem;
}

/* Checkboxes */
.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
}
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
}
.checkbox-item input[type="checkbox"] {
  accent-color: var(--green);
  width: 14px;
  height: 14px;
}
.checkbox-item span {
  font-size: 0.8rem;
  font-weight: 600;
}

/* Lens groups */
.lens-group { margin-bottom: 0.8rem; }
.lens-group:last-child { margin-bottom: 0; }
.lens-group-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 0.35rem;
}
.lens-chip {
  font-size: 0.9rem;
  padding: 0.25rem 0.55rem;
}
.lens-chip[title] { cursor: help; }

/* Collapsible */
.collapsible-header {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.collapsible-header .arrow {
  transition: transform 0.2s;
  color: var(--text-muted);
  font-size: 0.7rem;
}
.collapsible-header.open .arrow { transform: rotate(90deg); }
.collapsible-body {
  display: none;
  padding-top: 1rem;
}
.collapsible-body.open { display: block; }

/* Mechanisms row */
.mechanisms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 0.8rem;
}
.mechanism-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.7rem;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.mechanism-card .mech-label-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.mechanism-card .mech-label-row .toggle-label {
  font-size: 0.85rem;
}
.mechanism-card.disabled {
  opacity: 0.5;
  border-color: var(--border);
}

/* Command preview */
.preview-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: 50vh;
}
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 1rem;
  border-bottom: 1px solid var(--border);
}
.preview-header h2 {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--green);
  margin: 0;
  padding: 0;
  border: none;
}
.prefix-toggle {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.prefix-toggle button {
  background: var(--bg-elevated);
  border: none;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 0.65rem;
  padding: 0.2rem 0.5rem;
  cursor: pointer;
  border-right: 1px solid var(--border);
}
.prefix-toggle button:last-child { border-right: none; }
.prefix-toggle button.active {
  background: var(--green-dim);
  color: #fff;
}
.preview-code {
  flex: 1;
  padding: 1rem;
  overflow: auto;
  font-family: var(--mono);
  font-size: 0.78rem;
  line-height: 1.6;
  color: var(--green);
  white-space: pre-wrap;
  word-break: break-all;
}
.copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  width: 100%;
  padding: 0.7rem;
  background: var(--green);
  border: none;
  color: #fff;
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { background: var(--green-dim); }
.copy-btn.copied {
  background: var(--orange);
}

/* Config management */
.config-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
}
.config-box h3 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 0.7rem;
}
.config-save-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.7rem;
}
.config-save-row input {
  flex: 1;
  font-size: 0.8rem;
  padding: 0.4rem 0.6rem;
}
.config-load-row {
  display: flex;
  gap: 0.4rem;
}
.config-load-row select {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.8rem;
  padding: 0.4rem 0.6rem;
  outline: none;
}
.config-load-row select:focus {
  border-color: var(--border-focus);
}
.btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.4rem 0.7rem;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--text-muted); }
.btn-green { background: var(--green-dim); border-color: var(--green); color: #fff; }
.btn-green:hover { background: var(--green); }
.btn-red { color: var(--red); }
.btn-red:hover { border-color: var(--red); }
.config-list {
  margin-top: 0.5rem;
  max-height: 200px;
  overflow-y: auto;
}
.config-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 0.5rem;
  border-radius: var(--radius);
  font-size: 0.78rem;
  cursor: pointer;
  transition: background 0.1s;
}
.config-item:hover { background: var(--bg-elevated); }
.config-item .config-name { font-weight: 600; flex: 1; }
.config-item .config-actions {
  display: flex;
  gap: 0.3rem;
  opacity: 0;
  transition: opacity 0.1s;
}
.config-item:hover .config-actions { opacity: 1; }
.config-action-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.7rem;
  cursor: pointer;
  padding: 0.15rem 0.3rem;
  border-radius: 3px;
}
.config-action-btn:hover { color: var(--text); background: var(--bg-surface); }
.config-action-btn.delete:hover { color: var(--red); }

/* Browse button next to file inputs */
.file-input-row {
  display: flex;
  gap: 0.4rem;
  align-items: center;
}
.file-input-row input[type="text"] { flex: 1; }
.file-input-row .btn { flex-shrink: 0; padding: 0.5rem 0.7rem; }
.file-input-row input[type="file"] { display: none; }

/* Hidden */
.hidden { display: none !important; }
.expand-indicator { display: none; }

/* Info icon */
.info-icon {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--green);
  color: var(--green);
  font-size: 12px;
  font-family: var(--mono);
  font-weight: 700;
  cursor: pointer;
  margin-left: 0.5rem;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
  line-height: 1;
}
.info-icon:hover {
  background: var(--green);
  color: #fff;
}
/* Popover on click */
.info-popover {
  position: fixed;
  background: var(--bg-surface);
  border: 1px solid var(--green-dim);
  border-radius: var(--radius-lg);
  padding: 0.9rem 1rem;
  max-width: 360px;
  font-size: 0.82rem;
  color: var(--text);
  z-index: 200;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  font-family: var(--font);
  line-height: 1.55;
  animation: popoverIn 0.12s ease-out;
}
@keyframes popoverIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.info-popover .popover-flag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--green);
  background: var(--green-glow);
  border-radius: 3px;
  padding: 0.1rem 0.4rem;
  margin-bottom: 0.5rem;
}
.info-popover .popover-body {
  color: var(--text-muted);
}
/* Tag badges */
.tag-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--orange);
  border: 1px solid var(--orange-dim);
  border-radius: 3px;
  padding: 0rem 0.3rem;
  margin-left: 0.4rem;
  vertical-align: middle;
}

/* Responsive */
@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .preview-col {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    height: auto;
    padding: 0;
    z-index: 100;
    justify-content: flex-end;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
  }
  .preview-box {
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    max-height: none;
  }
  .preview-header {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .preview-header .expand-indicator {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.7rem;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .preview-header .expand-chevron {
    transition: transform 0.2s;
    font-size: 0.6rem;
  }
  .preview-col.expanded .expand-chevron {
    transform: rotate(180deg);
  }
  .preview-code {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 1rem;
  }
  .preview-col.expanded .preview-code {
    max-height: 35vh;
    overflow: auto;
    padding: 1rem;
  }
  .preview-header {
    padding: 0.5rem 0.8rem;
  }
  .copy-btn {
    padding: 0.45rem;
    font-size: 0.78rem;
  }
  .config-box { display: none; }
  .form-col { padding-bottom: 45vh; }
}
</style>
</head>
<body>

<header>
  <h1><span>Think Different</span> Framework</h1>
  <span class="version">Test Harness</span>
  <a class="npm-link" href="https://www.npmjs.com/package/@sinjin/think-different-framework" target="_blank" rel="noopener" title="View on npm"><svg viewBox="0 0 780 250"><path d="M240,250h100v-50h100V0H240V250z M340,50h50v100h-50V50z M480,0v200h100V50h50v150h50V50h50v150h50V0H480z M0,200h100V50h50v150h50V0H0V200z"/></svg></a>
</header>

<div class="layout">
  <div class="form-col">

    <!-- 1. Input (hand-coded: workflow chips control section visibility) -->
    <section id="sec-input">
      <h2>1. Input</h2>
      <div class="field">
        <div class="chips" id="workflow-chips">
          <span class="chip active" data-value="session">Session</span>
          <span class="chip" data-value="report-only">Report Only</span>
          <span class="chip" data-value="synthesise">Synthesise</span>
          <span class="chip" data-value="resume">Resume</span>
        </div>
      </div>
      <div id="session-inputs"></div>
      <div id="postprocess-inputs" class="hidden">
        <div id="input-report-only" class="hidden"></div>
        <div id="input-synthesise" class="hidden"></div>
        <div id="input-resume" class="hidden"></div>
      </div>
    </section>

    <!-- 2. Seed Preparation -->
    <section id="sec-seed-prep" class="session-section">
      <h2>2. Seed Preparation</h2>
      <div class="section-fields"></div>
    </section>

    <!-- 3. Composition -->
    <section id="sec-composition" class="session-section">
      <h2>3. Composition</h2>
      <div class="section-fields"></div>
    </section>

    <!-- 4. Mechanisms -->
    <section id="sec-mechanisms" class="session-section">
      <h2>4. Mechanisms</h2>
      <div class="section-fields"></div>
    </section>

    <!-- 5. Output -->
    <section id="sec-output" class="session-section">
      <h2>5. Output</h2>
      <div class="section-fields"></div>
    </section>

    <!-- Advanced -->
    <section id="sec-advanced" class="session-section">
      <div class="collapsible-header" id="advanced-toggle">
        <h2 style="margin: 0; padding: 0; border: 0;">Advanced</h2>
        <span class="arrow">&#9654;</span>
      </div>
      <div class="collapsible-body" id="advanced-body">
        <div class="section-fields"></div>
      </div>
    </section>

  </div>

  <!-- Right column: Preview + Config -->
  <div class="preview-col">
    <div class="preview-box">
      <div class="preview-header" id="preview-header">
        <h2>Command</h2>
        <span class="expand-indicator"><span class="expand-chevron">&#9650;</span> <span class="expand-label">Show</span></span>
        <div class="prefix-toggle" id="prefix-toggle">
          <button class="active" data-value="./think.sh">./think.sh</button>
          <button data-value="td">td</button>
        </div>
      </div>
      <div class="preview-code" id="command-output"></div>
      <button class="copy-btn" id="copy-btn">Copy Command</button>
    </div>

function pickRandom(arr, n) {
  const copy = [...arr];
  const result = [];
  for (let i = 0; i < Math.min(n, copy.length); i++) {
    const j = i + Math.floor(Math.random() * (copy.length - i));
    [copy[i], copy[j]] = [copy[j], copy[i]];
    result.push(copy[i]);
  }
  return result;
}

function makeInfoIcon(field) {
  if (!field.info) return '';
  const tip = field.help || '';
  return `<span class="info-icon" data-tip="${escAttr(tip)}" data-info="${escAttr(field.info)}" data-flag="${escAttr(field.flag || '')}">i</span>`;
}

function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function makeTags(field) {
  if (!field.tags || field.tags.length === 0) return '';
  return field.tags.map(t => `<span class="tag-badge">${t}</span>`).join('');
}

function makeLabel(field) {
  const flag = field.flag ? `<span class="flag">${field.flag}</span>` : '';
  return `<label>${field.label} ${flag}${makeTags(field)}${makeInfoIcon(field)}</label>`;
}

function renderTextField(field) {
  const ph = field.placeholderPool
    ? getRotatedPlaceholder(field.placeholderPool)
    : (field.placeholder || '');
  const help = field.help ? `<div class="help">${field.help}</div>` : '';
  return `<div class="field">${makeLabel(field)}<input type="text" id="${field.key}" placeholder="${escAttr(ph)}">${help}</div>`;
}

function renderTextareaField(field) {

    ? getRotatedPlaceholder(field.placeholderPool)

  const help = field.help ? `<div class="help">${field.help}</div>` : '';
  return `<div class="field">${makeLabel(field)}<textarea id="${field.key}" placeholder="${escAttr(ph)}"></textarea>${help}</div>`;
}

// Map section keys to container selectors
const SECTION_CONTAINERS = {
  'session-inputs': '#session-inputs',
  'report-only': '#input-report-only',
  'synthesise': '#input-synthesise',
  'resume': '#input-resume',
  'seed-prep': '#sec-seed-prep .section-fields',
  'composition': '#sec-composition .section-fields',
  'mechanisms': '#sec-mechanisms .section-fields',
  'output': '#sec-output .section-fields',
  'advanced': '#sec-advanced .section-fields',
};

function renderAllFields() {
  // Group fields by section
  const bySection = {};
  for (const field of FIELDS) {
    const sec = field.section;
    if (!bySection[sec]) bySection[sec] = [];
    bySection[sec].push(field);
  }

  for (const [section, fields] of Object.entries(bySection)) {
    const selector = SECTION_CONTAINERS[section];
    if (!selector) continue;
    const container = document.querySelector(selector);
    if (!container) continue;

    let html = '';
    // Advanced toggles: group consecutive toggles into one flex container
    if (section === 'advanced') {
      let toggleGroup = [];
      const flushToggles = () => {
        if (toggleGroup.length === 0) return;
        html += '<div class="field" style="display: flex; flex-direction: column; gap: 0.6rem;">';
        for (const tf of toggleGroup) {
          html += RENDERERS[tf.type](tf);
        }
        html += '</div>';
        toggleGroup = [];
      };
      for (const field of fields) {
        if (field.type === 'toggle') {
          toggleGroup.push(field);
        } else {
          flushToggles();
          const renderer = RENDERERS[field.type];
          if (renderer) html += renderer(field);
        }
      }
      flushToggles();
    } else {
      for (const field of fields) {
        const renderer = RENDERERS[field.type];
        if (renderer) html += renderer(field);
      }
    }

    container.innerHTML = html;
  }
}

// PLACEHOLDER ROTATION
// ══════════════════════════════════════════════════════════

const _placeholderCache = {};

function getRotatedPlaceholder(poolKey) {
  if (_placeholderCache[poolKey]) return _placeholderCache[poolKey];
  const pool = PLACEHOLDERS[poolKey];
  if (!pool) return '';
  const storageKey = 'td-ph-seen-' + poolKey;
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem(storageKey)) || []; } catch(e) { seen = []; }
  if (seen.length >= pool.length) seen = [];
  const unseen = pool.map((_, i) => i).filter(i => !seen.includes(i));
  const pick = unseen[Math.floor(Math.random() * unseen.length)];
  seen.push(pick);
  localStorage.setItem(storageKey, JSON.stringify(seen));
  _placeholderCache[poolKey] = pool[pick];
  return pool[pick];
}

let _activePopover = null;

function showPopover(iconEl) {
  dismissPopover();
  const info = iconEl.dataset.info;
  const flag = iconEl.dataset.flag;
  if (!info) return;

  const pop = document.createElement('div');
  pop.className = 'info-popover';
  if (flag) pop.innerHTML = `<div class="popover-flag">${flag}</div>`;
  pop.innerHTML += `<div class="popover-body">${info}</div>`;
  document.body.appendChild(pop);

  // Position near the icon
  const rect = iconEl.getBoundingClientRect();
  let top = rect.bottom + 8;
  let left = rect.left - 60;
  // Keep within viewport
  if (left < 12) left = 12;
  if (left + 360 > window.innerWidth) left = window.innerWidth - 372;
  if (top + 200 > window.innerHeight) top = rect.top - 8 - pop.offsetHeight;
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';

  _activePopover = pop;

  // Dismiss on click outside or Escape
  setTimeout(() => {
    document.addEventListener('click', _popoverClickOutside);
    document.addEventListener('keydown', _popoverEsc);
  }, 0);
}

function dismissPopover() {
  if (_activePopover) {
    _activePopover.remove();
    _activePopover = null;
    document.removeEventListener('click', _popoverClickOutside);
    document.removeEventListener('keydown', _popoverEsc);
  }
}

function _popoverClickOutside(e) {
  if (_activePopover && !_activePopover.contains(e.target) && !e.target.classList.contains('info-icon')) {
    dismissPopover();
  }
}

function _popoverEsc(e) {
  if (e.key === 'Escape') dismissPopover();
}

function buildPractitionerChips() {
  const el = document.getElementById('practitioner-chips');
  if (!el) return;
  const allNames = [...new Set([...PRACTITIONERS, ...STATE.practitioners])];
  el.innerHTML = allNames.map(p => {
    const isActive = STATE.practitioners.includes(p);
    const isCustom = !PRACTITIONERS.includes(p);
    const xBtn = isCustom ? `<span class="chip-x" data-delete="${p}">&times;</span>` : '';
    return `<span class="chip${isActive ? ' active' : ''}" data-value="${p}">${p}${xBtn}</span>`;
  }).join('');
}

function buildLensSelectors() {
  buildLensGroup('include-lenses', 'include');
  buildLensGroup('exclude-lenses', 'exclude');
}

function buildLensGroup(containerId, stateKey) {
  const container = document.getElementById(containerId);
  if (!container) return;
  let html = '';
  for (const [group, lenses] of Object.entries(LENSES)) {
    html += `<div class="lens-group"><div class="lens-group-label">${group}</div><div class="chips">`;
    for (const lens of lenses) {
      html += `<span class="chip lens-chip" data-lens-group="${stateKey}" data-value="${lens.key}" title="${lens.name} - ${lens.bias}">${lens.key}</span>`;
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function bindEvents() {
  // Info icon clicks (delegated)
  document.addEventListener('click', (e) => {
    const icon = e.target.closest('.info-icon');
    if (icon) {
      e.stopPropagation();
      showPopover(icon);
      return;
    }
  });

  // Workflow chips
  document.querySelectorAll('#workflow-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#workflow-chips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.workflow = chip.dataset.value;
      render();
    });
  });

  // Text/textarea inputs - bind all text and textarea fields from FIELDS
  const textFields = FIELDS.filter(f => f.type === 'text' || f.type === 'textarea');
  for (const field of textFields) {
    const el = document.getElementById(field.key);
    if (el) {
      el.addEventListener('input', (e) => { STATE[field.key] = e.target.value; render(); });
    }
  }

  // File inputs (text part)
  const fileFields = FIELDS.filter(f => f.type === 'file');
  for (const field of fileFields) {
    const el = document.getElementById(field.key);
    if (el) {
      el.addEventListener('input', (e) => { STATE[field.key] = e.target.value; render(); });
    }
  }

  // Seeds auto toggle + number
  const seedsAuto = document.getElementById('seedsAuto');
  if (seedsAuto) {
    seedsAuto.addEventListener('change', (e) => {
      STATE.seedsAuto = e.target.checked;
      document.getElementById('seeds-num-wrap').classList.toggle('hidden', e.target.checked);
      render();
    });
  }
  const seedsNum = document.getElementById('seeds');
  if (seedsNum) {
    seedsNum.addEventListener('input', (e) => { STATE.seeds = +e.target.value; render(); });
  }

  // Segmented controls
  const segmentedFields = FIELDS.filter(f => f.type === 'segmented' || f.type === 'segmented-with-custom');
  for (const field of segmentedFields) {
    const control = document.getElementById(field.key + '-control');
    if (!control) continue;
    control.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        control.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        STATE[field.key] = btn.dataset.value;
        // Depth custom field visibility
        if (field.customField) {
          const cfEl = document.getElementById(field.customField.key + '-field');
          if (cfEl) cfEl.style.display = STATE[field.key] !== field.default ? 'block' : 'none';
        }
        render();
      });
    });
    // Custom field input
    if (field.customField) {
      const cfInput = document.getElementById(field.customField.key);
      if (cfInput) {
        cfInput.addEventListener('input', (e) => { STATE[field.customField.key] = e.target.value; render(); });
      }
    }
  }

  // Range inputs (synced slider + number)
  const rangeFields = FIELDS.filter(f => f.type === 'range');
  for (const field of rangeFields) {
    const range = document.getElementById(field.key + 'Range');
    const num = document.getElementById(field.key + 'Num');
    if (range && num) {
      range.addEventListener('input', () => { num.value = range.value; STATE[field.key] = +range.value; render(); });
      num.addEventListener('input', () => { range.value = num.value; STATE[field.key] = +num.value; render(); });
    }
  }

  // Number inputs
  const numberFields = FIELDS.filter(f => f.type === 'number');
  for (const field of numberFields) {
    const el = document.getElementById(field.key);
    if (el) {
      el.addEventListener('input', (e) => { STATE[field.key] = +e.target.value; render(); });
    }
  }

  // Toggle checkboxes - collect all toggle fields
  const toggleFields = FIELDS.filter(f => f.type === 'toggle' || f.type === 'toggle-with-help');
  for (const field of toggleFields) {
    const el = document.getElementById(field.key);
    if (!el) continue;
    el.addEventListener('change', (e) => {
      STATE[field.key] = e.target.checked;
      // Mutual exclusion
      if (field.excludes) {
        for (const exKey of field.excludes) {
          if (e.target.checked) {
            STATE[exKey] = false;
            const exEl = document.getElementById(exKey);
            if (exEl) exEl.checked = false;
          }
        }
      }
      render();
    });
  }

  // Mechanism toggles
  document.querySelectorAll('#mechanisms input[data-key]').forEach(input => {
    input.addEventListener('change', (e) => {
      STATE[e.target.dataset.key] = e.target.checked;
      e.target.closest('.mechanism-card').classList.toggle('disabled', !e.target.checked);
      render();
    });
  });

  // Tone chips (multi-select with mixed logic)
  document.querySelectorAll('#tone-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.value;
      if (val === 'mixed') {
        if (chip.classList.contains('active')) {
          STATE.tone = ['provocative'];
        } else {
          STATE.tone = ['provocative', 'generous', 'personal', 'absurd', 'daydream'];
        }
      } else {
        const idx = STATE.tone.indexOf(val);
        if (idx >= 0) {
          STATE.tone.splice(idx, 1);
          if (STATE.tone.length === 0) STATE.tone = ['provocative'];
        } else {
          STATE.tone.push(val);
        }
      }
      syncToneChips();
      render();
    });
  });

  // Practitioner chips - toggle or delete
  const practChips = document.getElementById('practitioner-chips');
  if (practChips) {
    practChips.addEventListener('click', (e) => {
      const del = e.target.closest('[data-delete]');
      if (del) {
        const name = del.dataset.delete;
        STATE.practitioners = STATE.practitioners.filter(p => p !== name);
        buildPractitionerChips();
        render();
        return;
      }
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const val = chip.dataset.value;
      const idx = STATE.practitioners.indexOf(val);
      if (idx >= 0) { STATE.practitioners.splice(idx, 1); chip.classList.remove('active'); }
      else { STATE.practitioners.push(val); chip.classList.add('active'); }
      render();
    });
  }

  // Add custom practitioner
  function addPractitioner() {
    const input = document.getElementById('practitioner-input');
    const name = input.value.trim();
    if (!name || STATE.practitioners.includes(name)) { input.value = ''; return; }
    STATE.practitioners.push(name);
    input.value = '';
    buildPractitionerChips();
    render();
  }
  const practAdd = document.getElementById('practitioner-add');
  if (practAdd) practAdd.addEventListener('click', addPractitioner);
  const practInput = document.getElementById('practitioner-input');
  if (practInput) practInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addPractitioner(); });

  // Shuffle / reset practitioners
  const practShuffle = document.getElementById('practitioner-shuffle');
  if (practShuffle) practShuffle.addEventListener('click', () => {
    STATE.practitioners = pickRandom(PRACTITIONERS, 3);
    buildPractitionerChips();
    render();
  });
  const practReset = document.getElementById('practitioner-reset');
  if (practReset) practReset.addEventListener('click', () => {
    STATE.practitioners = pickRandom(PRACTITIONERS, 3);
    buildPractitionerChips();
    render();
  });

  // Checkbox groups (output types, formats)
  const checkboxFields = FIELDS.filter(f => f.type === 'checkboxes');
  for (const field of checkboxFields) {
    const container = document.getElementById(field.key + '-checks');
    if (!container) continue;
    container.querySelectorAll('input').forEach(cb => {
      cb.addEventListener('change', () => {
        STATE[field.key] = [...container.querySelectorAll('input:checked')].map(c => c.value);
        if (STATE[field.key].length === 0) STATE[field.key] = [...field.default];
        render();
      });
    });
  }

  // Mobile: default to expanded, toggle on tap
  if (window.innerWidth <= 900) {
    document.querySelector('.preview-col').classList.add('expanded');
    document.querySelector('.expand-label').textContent = 'Hide';
  }
  document.getElementById('preview-header').addEventListener('click', () => {
    if (window.innerWidth > 900) return;
    const col = document.querySelector('.preview-col');
    const label = document.querySelector('.expand-label');
    col.classList.toggle('expanded');
    label.textContent = col.classList.contains('expanded') ? 'Hide' : 'Show';
  });

  // Lens chips (include/exclude)
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip[data-lens-group]');
    if (!chip) return;
    const group = chip.dataset.lensGroup;
    const val = chip.dataset.value;
    const idx = STATE[group].indexOf(val);
    if (idx >= 0) { STATE[group].splice(idx, 1); chip.classList.remove('active'); }
    else { STATE[group].push(val); chip.classList.add('active'); }
    render();
  });

  // Prefix toggle
  document.querySelectorAll('#prefix-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#prefix-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.cmdPrefix = btn.dataset.value;
      render();
    });
  });

  // Copy button
  document.getElementById('copy-btn').addEventListener('click', copyCommand);

  // Collapsible
  document.getElementById('advanced-toggle').addEventListener('click', () => {
    document.getElementById('advanced-toggle').classList.toggle('open');
    document.getElementById('advanced-body').classList.toggle('open');
  });

  // Config
  document.getElementById('config-save').addEventListener('click', saveConfig);
  document.getElementById('config-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveConfig();
  });

  // Reset all to defaults
  document.getElementById('reset-all').addEventListener('click', () => {
    localStorage.removeItem('tdf-last-state');
    STATE = JSON.parse(JSON.stringify(DEFAULTS));
    applyStateToUI();
    render();
  });

  // Auto-save on unload
  window.addEventListener('beforeunload', () => {
    localStorage.setItem('tdf-last-state', JSON.stringify(STATE));
  });
}

function syncToneChips() {
  const allFive = ['provocative', 'generous', 'personal', 'absurd', 'daydream'];
  const isMixed = allFive.every(t => STATE.tone.includes(t));
  document.querySelectorAll('#tone-chips .chip').forEach(chip => {
    const val = chip.dataset.value;
    if (val === 'mixed') {
      chip.classList.toggle('active', isMixed);
    } else {
      chip.classList.toggle('active', STATE.tone.includes(val));
    }
  });
}

function render() {
  updateVisibility();

function updateVisibility() {
  const wf = STATE.workflow;
  const isSession = wf === 'session';

  // Session vs post-process inputs
  document.getElementById('session-inputs').classList.toggle('hidden', !isSession);
  document.getElementById('postprocess-inputs').classList.toggle('hidden', isSession);
  if (!isSession) {
    document.getElementById('input-report-only').classList.toggle('hidden', wf !== 'report-only');
    document.getElementById('input-synthesise').classList.toggle('hidden', wf !== 'synthesise');
    document.getElementById('input-resume').classList.toggle('hidden', wf !== 'resume');
  }

  // Session-only sections
  document.querySelectorAll('.session-section').forEach(sec => {
    if (sec.id === 'sec-output') {
      sec.classList.toggle('hidden', wf === 'resume');
    } else {
      sec.classList.toggle('hidden', !isSession);
    }
  });

  // Seeds auto/manual
  const seedsWrap = document.getElementById('seeds-num-wrap');
  if (seedsWrap) seedsWrap.classList.toggle('hidden', STATE.seedsAuto);

  // Autonomous vs non-autonomous
  const auto = STATE.autonomous;
  const turnsField = document.getElementById('turns-field');
  const minTurnsField = document.getElementById('min-turns-field');
  const roundsField = document.getElementById('rounds-field');
  const spiralsField = document.getElementById('spirals-field');
  const passesField = document.getElementById('passes-field');
  if (turnsField) turnsField.classList.toggle('hidden', !auto);
  if (minTurnsField) minTurnsField.classList.toggle('hidden', !auto);
  if (roundsField) roundsField.classList.toggle('hidden', auto || STATE.mode !== 'dyslexic');
  if (spiralsField) spiralsField.classList.toggle('hidden', auto || STATE.mode !== 'spiral');
  if (passesField) passesField.classList.toggle('hidden', auto || STATE.mode !== 'lapidary');
}

function updateCommandPreview() {
  const cmd = buildCommand();
  document.getElementById('command-output').textContent = cmd;
}

// ══════════════════════════════════════════════════════════
// COMMAND BUILDER
// ══════════════════════════════════════════════════════════

function q(s) {
  if (/^[a-zA-Z0-9_.\/,-]+$/.test(s)) return s;
  return '"' + s.replace(/"/g, '\\"') + '"';
}

function buildCommand() {
  const parts = [STATE.cmdPrefix];
  const wf = STATE.workflow;

  if (wf === 'session') {
    if (STATE.seedTopic) parts.push(q(STATE.seedTopic));
    if (STATE.briefFile) parts.push('--brief', q(STATE.briefFile));
    if (STATE.brandName) parts.push('--brand', q(STATE.brandName));
    if (STATE.notesText) parts.push('--notes', q(STATE.notesText));
  } else if (wf === 'report-only') {
    if (STATE.reportOnlyFile) parts.push('--regenerate', q(STATE.reportOnlyFile));
  } else if (wf === 'synthesise') {
    if (STATE.synthesiseFiles) {
      parts.push('--synthesise');
      STATE.synthesiseFiles.split('\n').filter(f => f.trim()).forEach(f => parts.push(q(f.trim())));
    }
  } else if (wf === 'resume') {
    if (STATE.resumeFile) parts.push('--resume', q(STATE.resumeFile));
  }

  const isSession = wf === 'session';

  if (isSession) {
    if (STATE.mode !== 'dyslexic') parts.push('--mode', STATE.mode);
    if (STATE.words !== 1500) parts.push('--words', '' + STATE.words);
    if (STATE.outputDir) parts.push('--output', q(STATE.outputDir));
    if (STATE.contextFile) parts.push('--context', q(STATE.contextFile));
    if (!STATE.seedsAuto && STATE.seeds) parts.push('--seeds', '' + STATE.seeds);
    if (STATE.pick) parts.push('--pick');
    if (STATE.audience) parts.push('--audience', q(STATE.audience));

    const defaultTone = STATE.tone.length === 1 && STATE.tone[0] === 'provocative';
    if (!defaultTone) parts.push('--tone', STATE.tone.join(','));

    const allSections = STATE.sections.length === 3 && ['insight', 'brief', 'manifesto'].every(t => STATE.sections.includes(t));
    if (!allSections) parts.push('--sections', STATE.sections.join(','));
    if (STATE.dialogue) parts.push('--dialogue');

    if (STATE.lines !== 3) parts.push('--lines', '' + STATE.lines);
    const practIsDefault = STATE.practitioners.length === PRACTITIONERS.length &&
      PRACTITIONERS.every(p => STATE.practitioners.includes(p)) &&
      STATE.practitioners.every(p => PRACTITIONERS.includes(p));
    if (!practIsDefault && STATE.practitioners.length > 0) parts.push('--practitioners', q(STATE.practitioners.join(',')));
    if (STATE.html) parts.push('--html');

    if (STATE.depth !== 'deep' || STATE.depthCustom) {
      let depthVal = STATE.depthCustom ? STATE.depthCustom : STATE.depth;
      if (STATE.depthCustom && STATE.depth !== 'deep') depthVal = STATE.depth + ',' + STATE.depthCustom;
      parts.push('--depth', depthVal);
    }

    if (!STATE.friction) parts.push('--no-friction');
    if (!STATE.bias) parts.push('--no-bias');
    if (!STATE.sensory) parts.push('--no-sensory');
    if (!STATE.transcendence) parts.push('--no-transcendence');
    if (!STATE.negative_space) parts.push('--no-negative-space');

    if (!STATE.autonomous) {
      parts.push('--no-autonomous');
      if (STATE.mode === 'dyslexic' && STATE.rounds !== 4) parts.push('--rounds', '' + STATE.rounds);
      if (STATE.mode === 'spiral' && STATE.spirals !== 3) parts.push('--spirals', '' + STATE.spirals);
      if (STATE.mode === 'lapidary' && STATE.passes !== 3) parts.push('--passes', '' + STATE.passes);
    } else {
      if (STATE.turns !== 35) parts.push('--turns', '' + STATE.turns);
      if (STATE.minTurns !== 15) parts.push('--min-turns', '' + STATE.minTurns);
    }

    if (STATE.include.length > 0) parts.push('--include', STATE.include.join(','));
    if (STATE.exclude.length > 0) parts.push('--exclude', STATE.exclude.join(','));
    if (STATE.shuffle) parts.push('--shuffle');
    if (STATE.skipStrict) parts.push('--skip-strict');
    if (STATE.compact) parts.push('--compact');
    if (STATE.noProgressive) parts.push('--no-progressive');
    if (STATE.noGround) parts.push('--no-ground');
    if (STATE.groundOnly) parts.push('--ground-only');
    if (STATE.noContext) parts.push('--no-context');
    if (STATE.noWait) parts.push('--no-wait');
    if (STATE.multistep) parts.push('--multistep');
    if (STATE.allowedTools !== 'WebSearch,WebFetch') {
      parts.push('--allowedTools', STATE.allowedTools ? q(STATE.allowedTools) : '""');
    }
  } else {
    // Non-session modes
    if (STATE.words !== 1500) parts.push('--words', '' + STATE.words);
    if (STATE.outputDir) parts.push('--output', q(STATE.outputDir));
    if (wf === 'report-only') {
      const allFormats = STATE.formats.length === 1 && STATE.formats[0] === 'all';
      if (!allFormats) parts.push('--formats', STATE.formats.join(','));
      if (STATE.html) parts.push('--html');
    }
  }

  // Format for display: wrap long commands
  if (parts.length > 4) {
    return parts[0] + ' ' + parts.slice(1).reduce((acc, part, i) => {
      const prev = parts[i];
      if (i > 0 && !part.startsWith('-') && parts[i].startsWith('-')) {
        return acc + ' ' + part;
      }
      if (i === 0) return part;
      return acc + ' \\\n  ' + part;
    }, '');
  }
  return parts.join(' ');
}

function copyCommand() {
  const text = getCommandOneLine();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Command'; btn.classList.remove('copied'); }, 1500);
  });
}

// ══════════════════════════════════════════════════════════
// CONFIG MANAGEMENT
// ══════════════════════════════════════════════════════════

function getConfigs() {
  try { return JSON.parse(localStorage.getItem('tdf-configs') || '{}'); } catch { return {}; }
}

function saveConfig() {
  const nameEl = document.getElementById('config-name');
  const name = nameEl.value.trim();
  if (!name) return;
  const configs = getConfigs();
  configs[name] = JSON.parse(JSON.stringify(STATE));
  localStorage.setItem('tdf-configs', JSON.stringify(configs));
  nameEl.value = '';
  renderConfigList();
}

function loadConfig(name) {
  const configs = getConfigs();
  if (!configs[name]) return;
  STATE = JSON.parse(JSON.stringify(configs[name]));
  applyStateToUI();
  render();
}

function deleteConfig(name) {
  const configs = getConfigs();
  delete configs[name];
  localStorage.setItem('tdf-configs', JSON.stringify(configs));
  renderConfigList();
}

function renderConfigList() {
  const configs = getConfigs();
  const list = document.getElementById('config-list');
  const names = Object.keys(configs);
  if (names.length === 0) {
    list.innerHTML = '<div style="font-size: 0.8rem; color: var(--text-muted); padding: 0.3rem;">No saved configs</div>';
    return;
  }
  list.innerHTML = names.map(name => `
    <div class="config-item">
      <span class="config-name" onclick="loadConfig('${name.replace(/'/g, "\\'")}')">${name}</span>
      <span class="config-actions">
        <button class="config-action-btn" onclick="loadConfig('${name.replace(/'/g, "\\'")}')">Load</button>
        <button class="config-action-btn delete" onclick="deleteConfig('${name.replace(/'/g, "\\'")}')">Delete</button>
      </span>
    </div>
  `).join('');
}

// ══════════════════════════════════════════════════════════
// STATE <-> UI SYNC
// ══════════════════════════════════════════════════════════

function applyStateToUI() {
  // Workflow chips
  document.querySelectorAll('#workflow-chips .chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.value === STATE.workflow);
  });

  // Text/textarea/file inputs
  const inputFields = FIELDS.filter(f => f.type === 'text' || f.type === 'textarea' || f.type === 'file');
  for (const field of inputFields) {
    const el = document.getElementById(field.key);
    if (el) el.value = STATE[field.key] || '';
  }

  // Seeds
  const seedsAuto = document.getElementById('seedsAuto');
  if (seedsAuto) {
    seedsAuto.checked = STATE.seedsAuto;
    document.getElementById('seeds-num-wrap').classList.toggle('hidden', STATE.seedsAuto);
  }
  const seedsNum = document.getElementById('seeds');
  if (seedsNum) seedsNum.value = STATE.seeds;

  // Segmented controls
  const segmentedFields = FIELDS.filter(f => f.type === 'segmented' || f.type === 'segmented-with-custom');
  for (const field of segmentedFields) {
    const control = document.getElementById(field.key + '-control');
    if (!control) continue;
    control.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.value === STATE[field.key]);
    });
    if (field.customField) {
      const cfInput = document.getElementById(field.customField.key);
      if (cfInput) cfInput.value = STATE[field.customField.key] || '';
      const cfField = document.getElementById(field.customField.key + '-field');
      if (cfField) cfField.style.display = STATE[field.key] !== field.default ? 'block' : 'none';
    }
  }

  // Range sliders
  const rangeFields = FIELDS.filter(f => f.type === 'range');
  for (const field of rangeFields) {
    const range = document.getElementById(field.key + 'Range');
    const num = document.getElementById(field.key + 'Num');
    if (range) range.value = STATE[field.key];
    if (num) num.value = STATE[field.key];
  }

  // Number inputs
  const numberFields = FIELDS.filter(f => f.type === 'number');
  for (const field of numberFields) {
    const el = document.getElementById(field.key);
    if (el) el.value = STATE[field.key];
  }

  // Toggles
  const toggleFields = FIELDS.filter(f => f.type === 'toggle' || f.type === 'toggle-with-help');
  for (const field of toggleFields) {
    const el = document.getElementById(field.key);
    if (el) el.checked = STATE[field.key];
  }

  // Mechanisms
  const mechField = FIELDS.find(f => f.type === 'mechanisms');
  if (mechField) {
    for (const m of mechField.mechanisms) {
      const input = document.querySelector(`input[data-key="${m.key}"]`);
      if (input) {
        input.checked = STATE[m.key];
        input.closest('.mechanism-card').classList.toggle('disabled', !STATE[m.key]);
      }
    }
  }

  // Tone chips
  syncToneChips();

  // Practitioner chips
  buildPractitionerChips();

  // Checkbox groups
  const checkboxFields = FIELDS.filter(f => f.type === 'checkboxes');
  for (const field of checkboxFields) {
    const container = document.getElementById(field.key + '-checks');
    if (!container) continue;
    container.querySelectorAll('input').forEach(cb => {
      cb.checked = STATE[field.key].includes(cb.value);
    });
  }

  // Lens chips
  document.querySelectorAll('.chip[data-lens-group="include"]').forEach(chip => {
    chip.classList.toggle('active', STATE.include.includes(chip.dataset.value));
  });
  document.querySelectorAll('.chip[data-lens-group="exclude"]').forEach(chip => {
    chip.classList.toggle('active', STATE.exclude.includes(chip.dataset.value));
  });

  // Prefix toggle
  document.querySelectorAll('#prefix-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.value === STATE.cmdPrefix);
  });
}

function loadLastState() {
  try {
    const saved = JSON.parse(localStorage.getItem('tdf-last-state'));
    if (saved) {
      STATE = { ...JSON.parse(JSON.stringify(DEFAULTS)), ...saved };
      // Migrate legacy inputMode to workflow
      if (STATE.inputMode) {
        if (['seed', 'brief', 'brand', 'notes'].includes(STATE.inputMode)) {
          STATE.workflow = 'session';
        } else if (STATE.inputMode === 'report-only') {
          STATE.workflow = 'report-only';
        } else {
          STATE.workflow = STATE.inputMode;
        }
        delete STATE.inputMode;
      }
      // Migrate legacy type to sections
      if (STATE.type && !STATE.sections) {
        STATE.sections = STATE.type.filter(t => t !== 'dialogue');
        if (STATE.type.includes('dialogue')) STATE.dialogue = true;
        delete STATE.type;
      }
      applyStateToUI();
    }
  } catch {}
  renderConfigList();
}

// ══════════════════════════════════════════════════════════
// FILE PICKER
// ══════════════════════════════════════════════════════════

function initFilePicker() {
  document.querySelectorAll('[data-browse]').forEach(btn => {
    const targetId = btn.dataset.browse;
    const picker = document.getElementById(targetId + '-picker');
    if (!picker) return;

    btn.addEventListener('click', () => picker.click());

    picker.addEventListener('change', () => {
      if (picker.files.length > 0) {
        const input = document.getElementById(targetId);
        input.value = picker.files[0].name;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      picker.value = '';
    });
  });
}

// ══════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', init);
</script>
